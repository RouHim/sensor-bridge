[package]
name = "sensor-bridge"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
sensor-core = { path = "../../sensor-core" }
lazy_static = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bincode-next = { version = "3.1.1", features = ["serde"] }
tauri = { version = "2.6.2", features = ["protocol-asset", "tray-icon"] }
systemstat = "0.2.7"
rayon = "1.9.0"
base64 = "0.23.1"
warp = { version = "0.4.3", features = ["server"] }
tokio = { version = "1.0", features = ["full"] }
image = "0.24.9"
chrono = { version = "0.4.34", features = ["serde"] }
log = "0.4.21"
env_logger = "0.11.2"
super-shell = "1.2.3"
md5 = "0.8.1"
zip-extract = "0.1.3"
font-loader = { git = "https://github.com/matprec/rust-font-loader" }
rusttype = "0.9.3"
ureq = { version = "3.4.2", features = ["json"] }
dirs = "5.0.1"
atomic-write-file = "0.2.3"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lm-sensors = "0.5.1"
dmidecode = "1.0.1"

[dev-dependencies]
assertor = "0.0.4"
pretty_assertions = "1.4.1"
warp = { version = "0.4.3", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
strip = true # Strip debug symbols
